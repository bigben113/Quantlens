services:
  ai-service:
    build:
      context: ./apps/ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      AI_SERVICE_VERSION: ${AI_SERVICE_VERSION:-0.1.0}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
    ports:
      - "${API_PORT:-8086}:8086"
    environment:
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-2000}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/api/v1/system/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./apps/web
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8086}
    depends_on:
      - api
